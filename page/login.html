<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>进入资料工作台 · 教育智库</title><script src="/static/theme.js?v=3"></script><link rel="stylesheet" href="/static/interface.css?v=theme-4"></head>
<body class="login-page"><main class="login-layout">
<section class="login-story"><div class="login-top"><a class="brand" href="/"><span class="brand-symbol" aria-hidden="true">◈</span><span>教育智库<small>教育知识检索</small></span></a><button type="button" class="theme-toggle secondary" data-theme-toggle aria-label="切换亮色模式">暗色</button></div><div class="login-story-main"><div class="eyebrow">教育智库 / 资料管理</div><h1>资料管理，<br><span>从这里开始。</span></h1><p>在这里，整理你的课程、讲义与项目。<br>让每一份资料，成为下一次探索的起点。</p></div><div class="login-art" aria-hidden="true"></div><div class="story-footer"><span>EDUCATION INTELLIGENCE</span><span>02 / THE WORKSPACE</span></div></section>
<section class="login-form-area"><div class="login-card"><div class="login-step"><span>MEMBERS ACCESS</span><span>↗ 02</span></div><h2>进入资料工作台</h2><p>检索向所有人开放。<br>上传与管理资料，请先验证你的身份。</p><form id="loginForm"><label for="username">用户名 / USERNAME</label><input id="username" name="username" autocomplete="username" maxlength="64" placeholder="你的管理账号" required autofocus><label for="password">密码 / PASSWORD</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="输入密码" required><button type="button" id="togglePassword" class="password-toggle" aria-label="显示密码" aria-pressed="false">显示</button></div><div id="loginError" class="inline-error" role="alert" hidden></div><button class="login-submit" id="loginButton" type="submit"><span>验证并进入</span><span aria-hidden="true">↗</span></button></form><a class="login-back" href="/">← 返回知识探索</a><div class="login-note">仅限已授权的资料管理员。<br>如需开通账号，请联系项目管理员。</div></div></section>
</main><script>
const form=document.getElementById('loginForm'),password=document.getElementById('password'),button=document.getElementById('loginButton'),error=document.getElementById('loginError');
document.getElementById('togglePassword').addEventListener('click',event=>{const show=password.type==='password';password.type=show?'text':'password';event.currentTarget.textContent=show?'隐藏':'显示';event.currentTarget.setAttribute('aria-label',show?'隐藏密码':'显示密码');event.currentTarget.setAttribute('aria-pressed',String(show));});
form.addEventListener('submit',async event=>{event.preventDefault();if(button.disabled)return;error.hidden=true;button.disabled=true;button.firstElementChild.textContent='正在验证…';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value.trim(),password:password.value})});const data=await response.json();if(!response.ok)throw Error(data.message||'登录失败，请稍后重试');password.value='';location.replace('/import');}catch(exc){error.textContent=exc.message||'无法连接服务，请稍后重试';error.hidden=false;}finally{button.disabled=false;button.firstElementChild.textContent='验证并进入';}});
fetch('/api/auth/me').then(response=>response.json()).then(data=>{if(data.authenticated)location.replace('/import');}).catch(()=>{});
</script></body></html>
