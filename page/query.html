<!doctype html>

<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教育智库 · 检索问答</title>
<script src="/static/theme.js?v=3"></script><link rel="stylesheet" href="/static/interface.css?v=theme-6"></head>
<body class="query-page"><div class="shell"><aside class="sidebar"><a class="brand" href="/" aria-label="教育智库首页"><span class="brand-symbol" aria-hidden="true">◈</span><span>教育智库<small>教育知识检索</small></span></a><nav><a href="/" aria-current="page"><span>01</span> 检索问答</a><a href="/import"><span>02</span> 资料工作台</a></nav><button id="newSession">＋ 新建会话</button><div class="rail-caption">最近会话</div><div id="sessions" aria-label="历史会话"></div><div id="sessionError" class="inline-error" role="alert" hidden></div><button id="deleteSession" class="danger clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg><span>删除当前会话</span></button></aside>
<main class="main"><header class="query-header"><div><h1>检索问答</h1><span id="progressBrief" class="header-status">教育智库</span></div><div class="header-actions"><button type="button" class="theme-toggle secondary" data-theme-toggle aria-label="切换亮色模式">暗色</button><button type="button" id="settingsButton" class="secondary" aria-haspopup="dialog">检索设置</button><button type="button" id="sourcesButton" class="secondary" aria-expanded="false" aria-controls="sourcePanel">引用 <span id="sourceCount">0</span></button><a class="upload-link" href="/import">上传资料 ↗</a></div></header>

<section class="card progress-card"><h2>流程进度</h2><div id="progress" class="status">等待提问</div><div id="rewrite" class="rewrite"></div></section><section class="card sources-card"><h2>引用与完整资料</h2><div id="sources" class="empty-sources">回答生成后，在这里查看原文、题目答案、图片与来源文件。</div></section></aside></div></main></div>
<dialog id="searchSettings"><section class="card settings-card"><div class="dialog-header"><div><h2>检索设置</h2><p>选择范围与检索方式</p></div><button type="button" id="closeSettings" class="icon-button" aria-label="关闭检索设置">×</button></div><div class="form-grid"><label>结果方式<select id="mode"><option value="answer">生成回答</option><option value="search">只检索资料</option></select></label><label>内容范围<select id="scope"><option value="all">全部资料</option><option value="course_intro">课程介绍</option><option value="document_chunk">文档片段</option><option value="project_material">项目资料</option><option value="question">题目</option></select></label><label>课程名称<input id="course_name" maxlength="512" placeholder="精确名称，选填"></label><label>课程系列<input id="series_name" maxlength="512" placeholder="选填"></label><label>项目名称<input id="project_name" maxlength="512" placeholder="选填"></label><label>章节名称<input id="chapter_name" maxlength="512" placeholder="选填"></label><label>题库名称<input id="question_bank_name" maxlength="512" placeholder="选填"></label><label>题目编码<input id="question_code" maxlength="512" placeholder="例如 Q1"></label><label>题型<select id="question_type"><option value="">不限</option><option value="single_choice">单选题</option><option value="multiple_choice">多选题</option><option value="true_false">判断题</option><option value="fill_blank">填空题</option><option value="short_answer">简答题</option><option value="programming">编程题</option><option value="calculation">计算题</option><option value="other">其他</option></select></label><label>返回条数<select id="top_k"><option>3</option><option selected>5</option><option>10</option></select></label><label class="wide">来源文件名<input id="source_file_name" maxlength="512" placeholder="含扩展名，选填"></label></div></section><div class="dialog-footer"><button type="button" id="applySettings">完成</button></div></dialog>
<script>
const $=id=>document.getElementById(id), nodeNames={entry:'入口校验',load_history:'加载历史',rewrite:'意图识别与改写',subject_confirm:'主体确认',vector_search:'混合检索',hyde_search:'假设性检索（HyDE）',web_search:'网络搜索',join_rrf:'RRF融合',rerank:'精准重排',answer:'生成结果',save_history:'保存历史',handle_error:'错误收尾'};
function openSources(open=true){$('sourcePanel').hidden=!open;document.querySelector('.workspace').classList.toggle('sources-open',open);$('sourcesButton').setAttribute('aria-expanded',String(open));}
$('sourcesButton').addEventListener('click',()=>openSources($('sourcePanel').hidden));$('closeSources').addEventListener('click',()=>openSources(false));
$('settingsButton').addEventListener('click',()=>$('searchSettings').showModal());$('closeSettings').addEventListener('click',()=>$('searchSettings').close());$('applySettings').addEventListener('click',()=>$('searchSettings').close());
const welcomeTemplate=$('welcome').cloneNode(true);
// getRandomValues 在 HTTP 局域网地址下也可用；编号保持 UUID v4 的 32 位十六进制格式。
function createId(){
 const bytes=crypto.getRandomValues(new Uint8Array(16));
 bytes[6]=(bytes[6]&15)|64;
 bytes[8]=(bytes[8]&63)|128;
 return Array.from(bytes,byte=>byte.toString(16).padStart(2,'0')).join('');
}
let sessionId=createId(), controller=null, busy=false, version=0;
function el(tag,text,cls){const element=document.createElement(tag);if(text!==undefined)element.textContent=text;if(cls)element.className=cls;return element;}
function showError(id,text){$(id).textContent=text;$(id).hidden=!text;}
async function api(url,options){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw Error(data.message||'请求失败');return data;}
function bubble(role,text){$('welcome')?.remove();const article=el('article',undefined,'bubble '+role);article.append(el('div',role==='user'?'你':'教育智库','role'));const body=el('div',text,'answer');article.append(body);$('messages').append(article);$('messages').scrollTop=$('messages').scrollHeight;return {article,body};}
// 模型片段到达后立即开始逐字显示；较大片段自动加速，避免积压。
function createAnswerWriter(body){
 let characters=[],shown=0,timer=null,settled=null;
 function tick(){
  timer=null;
  shown=Math.min(characters.length,shown+Math.max(2,Math.ceil((characters.length-shown)/30)));
  body.textContent=characters.slice(0,shown).join('');
  $('messages').scrollTop=$('messages').scrollHeight;
  if(shown<characters.length)timer=setTimeout(tick,16);
  else if(settled){settled();settled=null;}
 }
 function append(text){characters.push(...Array.from(text));if(timer===null)tick();}
 function flush(text){clearTimeout(timer);timer=null;characters=Array.from(text);shown=characters.length;body.textContent=text;if(settled){settled();settled=null;}}
 async function finish(answer){
  const received=characters.join('');
  // 服务端校验失败等情况下，采用最终结果，避免展示无效引用。
  if(received.trim()!==answer){flush(answer);return;}
  if(shown<characters.length)await new Promise(resolve=>{settled=resolve;});
  body.textContent=answer;
 }
 return {append,finish,flush};
}
function busyState(value){busy=value;$('send').disabled=value;$('stop').hidden=!value;$('newSession').disabled=value;$('deleteSession').disabled=value;document.querySelectorAll('.session').forEach(button=>button.disabled=value);}
async function refreshSessions(){try{const data=await api('/api/query/sessions');$('sessions').replaceChildren();for(const session of data.sessions){const button=el('button',session.title||'会话','session'+(session.session_id===sessionId?' active':''));button.disabled=busy;button.addEventListener('click',()=>loadSession(session.session_id));$('sessions').append(button);}showError('sessionError','');}catch(error){showError('sessionError',error.message);const retry=el('button','重试连接','secondary');retry.type='button';retry.addEventListener('click',()=>{retry.disabled=true;refreshSessions();});$('sessionError').append(document.createElement('br'),retry);}}
function renderSources(refs,ready=true){
 $('sourceCount').textContent=String(refs?.length||0);
 $('sources').replaceChildren();$('sources').className='';
 if(!refs?.length){$('sources').append(el('p','没有可用引用。','empty-sources'));return;}
 for(const ref of refs){
  // 默认折叠整张引用卡片，标题可点击；摘要、原图、下载均放在展开区域。
  const box=el('details',undefined,'ref');box.dataset.referenceId=String(ref.id);box.tabIndex=-1;
  const summary=el('summary',undefined,'ref-summary');
  summary.append(el('span',ref.kind==='web'?'外部网页':'知识库资料','badge'),el('strong','['+ref.id+'] '+ref.title));
  // 显示真实排序分数；旧记录缺少字段时不补造，分数不是答案准确率。
  if(typeof ref.rerank_score==='number'&&Number.isFinite(ref.rerank_score)){
   const score=el('div','重排序分数：'+ref.rerank_score.toFixed(4),'meta');
   score.title='重排序模型对问题与该资料的相关性评分，用于排序，不代表答案准确率';summary.append(score);
  }
  box.append(summary);
  const content=el('div',undefined,'ref-content');content.append(el('p',ref.content||''));
  if(typeof ref.rrf_score==='number'&&Number.isFinite(ref.rrf_score)){
   const score=el('div','RRF 融合分数：'+ref.rrf_score.toFixed(6),'meta');
   score.title='根据多路召回名次累加的融合分数，与重排序分数的量纲不同';content.prepend(score);
  }
  const row=ref.row||{},location=row.source_locator||{};
  content.append(el('p',[row.course_name,row.project_name,row.chapter_name,row.question_bank_name,row.question_code,row.source_file_name,location.page?'第'+location.page+'页':'',location.markdown_line_start?'转换MD第'+location.markdown_line_start+'行':''].filter(Boolean).join(' · ')));
  const actions=el('div',undefined,'actions');
  if(ref.kind==='web'){
   try{const url=new URL(ref.url);if(['https:','http:'].includes(url.protocol)){const link=el('a','打开网页');link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';actions.append(link);}}catch{}
  }else{
   const link=el('a','下载原文件');
   if(ready)link.href=ref.download_url;else{link.textContent='回答完成后可下载';link.setAttribute('aria-disabled','true');}
   actions.append(link);
   const details=el('details');details.append(el('summary','查看完整内容 / 答案解析'));
   const detailBody=el('pre');details.append(detailBody);let loaded=false;
   details.addEventListener('toggle',async()=>{
    if(!details.open||loaded)return;
    try{
     detailBody.textContent='正在读取……';
     const current=ref.record?ref:await api(ref.download_url.replace(/\/file$/,''));
     const record=current.record||{},payload=record.payload||{};
     detailBody.textContent=[record.content,payload.stem?'题干：'+payload.stem:'',payload.options?.length?'选项：\n'+payload.options.map(o=>o.label+'. '+o.text).join('\n'):'',payload.answer?'答案：'+payload.answer:'',payload.explanation?'解析：'+payload.explanation:'',record.metadata?'归属：\n'+JSON.stringify(record.metadata,null,2):''].filter(Boolean).join('\n\n');
     loaded=true;
    }catch(error){detailBody.textContent=error.message;}
   });
   content.append(details);
   for(const image of ref.images||[]){const img=el('img');img.alt=image.description||'来源图片';img.loading='lazy';img.dataset.source=image.url;content.append(img);}
  }
  content.append(actions);box.append(content);$('sources').append(box);
 }
}
// HTML 仅来自服务端禁用原始 HTML/图片的 Markdown 渲染器。
function renderAnswerContent(view,text,refs,html){
 if(!html){view.body.textContent=text;return;}
 view.body.innerHTML=html;view.body.classList.add('markdown');
 const known=new Map((refs||[]).map(ref=>[String(ref.id),ref]));
 for(const link of view.body.querySelectorAll('a')){
  const url=link.getAttribute('href')||'';
  if(!/^(https?:\/\/|\/(?!\/)|#)/i.test(url))link.removeAttribute('href');
  else{link.target='_blank';link.rel='noopener noreferrer';}
 }
 const walker=document.createTreeWalker(view.body,NodeFilter.SHOW_TEXT),nodes=[];
 while(walker.nextNode())if(!walker.currentNode.parentElement.closest('a,code,pre'))nodes.push(walker.currentNode);
 for(const node of nodes){
  const fragment=document.createDocumentFragment();let offset=0,changed=false;
  for(const match of node.textContent.matchAll(/\[(\d+)\]/g)){
   if(!known.has(match[1]))continue;
   fragment.append(document.createTextNode(node.textContent.slice(offset,match.index)));
   const isWeb=known.get(match[1]).kind==='web';
   const link=el('a',match[0],'citation '+(isWeb?'citation-web':'citation-knowledge'));link.href='#sources';link.title=(isWeb?'网络来源':'知识库来源')+' ['+match[1]+']，点击查看';
   link.addEventListener('click',event=>{
    event.preventDefault();openSources();renderSources(refs);activateImages();
    const target=Array.from($('sources').children).find(box=>box.dataset.referenceId===match[1]);
    if(target){target.open=true;target.querySelector('details')?.setAttribute('open','');target.scrollIntoView({behavior:'smooth',block:'center'});target.focus({preventScroll:true});}
   });
   fragment.append(link);offset=match.index+match[0].length;changed=true;
  }
  if(changed){fragment.append(document.createTextNode(node.textContent.slice(offset)));node.replaceWith(fragment);}
 }
}
// 仅展示服务端引用中的原图；模型输出的任意其他地址不能变成图片请求。
function renderAnswerImages(view,answer,refs,status,html){
 view.article.querySelector('.answer-images')?.remove();
 const marker=answer.indexOf('【图片】'), body=marker<0?answer:answer.slice(0,marker).trimEnd();
 const requested=marker<0?[]:answer.slice(marker+'【图片】'.length).split(/\s+/).filter(Boolean);
 const gallery=el('div',undefined,'answer-images'),seen=new Set();
 renderAnswerContent(view,body,refs,html);
 if(status!=='completed')return;
 for(const ref of refs||[]){
  if(ref.kind==='web')continue;
  for(const image of ref.images||[]){
   if(!requested.includes(image.url))continue;
   // 复用来源代理，历史会话也会重新核验来源是否仍然有效。
   if(typeof image.url!=='string'||!image.url.startsWith('/api/query/references/'))continue;
   const key=ref.row?.document_id+':'+image.resource_id;
   if(seen.has(key))continue;seen.add(key);
   const figure=el('figure'),link=el('a'),img=el('img');
   link.href=image.url;link.target='_blank';link.rel='noopener noreferrer';
   img.alt=image.description||'资料原图';img.loading='lazy';img.src=image.url;
   img.addEventListener('error',()=>{img.hidden=true;link.textContent='图片暂不可用，点击重新查看原图';});
   link.append(img);figure.append(link,el('figcaption','['+ref.id+'] '+(image.description||ref.title||'资料原图')));gallery.append(figure);
  }
 }
 if(gallery.childElementCount)view.body.after(gallery);
}
function activateImages(){document.querySelectorAll('img[data-source]').forEach(image=>{image.src=image.dataset.source;delete image.dataset.source;});}
async function loadSession(id){if(busy)return;const token=++version;try{const data=await api('/api/query/sessions/'+encodeURIComponent(id)+'/messages');if(token!==version)return;sessionId=id;$('messages').replaceChildren();$('sources').replaceChildren();for(const message of data.messages){const view=bubble(message.role,message.text||'');if(message.role==='assistant')renderAnswerContent(view,message.text||'',message.result?.references||[],message.answer_html);if(message.status==='interrupted')view.article.append(el('div','该回答已停止生成','meta'));if(message.role==='assistant'&&message.result?.references){renderAnswerImages(view,message.text||'',message.result.references,message.status||message.result.status,message.answer_html);renderSources(message.result.references);}}activateImages();$('progress').textContent='已加载会话历史';await refreshSessions();}catch(error){showError('queryError',error.message);}}
async function consumeSSE(response,onEvent){if(!response.ok){let data;try{data=await response.json();}catch{}throw Error(data?.message||'检索请求失败');}if(!response.body)throw Error('浏览器不支持流式读取');const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';async function parse(frame){let event='message',lines=[];for(const line of frame.split('\n')){if(line.startsWith('event:'))event=line.slice(6).trim();if(line.startsWith('data:'))lines.push(line.slice(5).trimStart());}if(lines.length)await onEvent(event,JSON.parse(lines.join('\n')));}try{while(true){const {value,done}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});buffer=buffer.replaceAll('\r\n','\n');let position;while((position=buffer.indexOf('\n\n'))>=0){await parse(buffer.slice(0,position));buffer=buffer.slice(position+2);}if(done){if(buffer.trim())await parse(buffer);break;}}}finally{reader.releaseLock();}}
$('queryForm').addEventListener('submit',async event=>{event.preventDefault();if(busy)return;const question=$('question').value.trim();if(!question)return;const requestId=createId();const filters={};for(const name of ['series_name','course_name','project_name','chapter_name','source_file_name','question_bank_name','question_code','question_type'])filters[name]=$(name).disabled?'':$(name).value.trim();const payload={session_id:sessionId,request_id:requestId,question,mode:$('mode').value,scope:$('scope').value,filters,top_k:Number($('top_k').value),use_hyde:$('use_hyde').checked,use_web:$('use_web').checked,is_stream:$('is_stream').checked};bubble('user',question);const view=bubble('assistant','正在检索……');const writer=createAnswerWriter(view.body);$('question').value='';$('sources').replaceChildren();$('rewrite').textContent='';showError('queryError','');busyState(true);controller=new AbortController();let text='',terminal=false,failed=false;try{const response=await fetch('/api/query/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal});await consumeSSE(response,async(event,data)=>{if(event==='progress'){$('progressBrief').textContent=(data.running_nodes||[]).map(n=>nodeNames[n]||n).join(' · ')||'处理中';$('progress').textContent='正在运行：'+(data.running_nodes||[]).map(n=>nodeNames[n]||n).join('、')+'\n已完成：'+(data.completed_nodes||[]).map(n=>nodeNames[n]||n).join(' → ');}if(event==='sources'){renderSources(data.references,false);$('rewrite').textContent='检索问题：'+data.rewritten_query;}if(event==='delta'&&payload.is_stream){text+=data.text;writer.append(data.text);}if(event==='result'){terminal=true;if(payload.is_stream)await writer.finish(data.answer||'');else writer.flush(data.answer||'');renderAnswerImages(view,data.answer||'',data.references,data.status,data.answer_html);renderSources(data.references);activateImages();$('progress').textContent=data.status==='completed'?'处理完成':data.status==='clarification_required'?'需要补充信息':'未找到充分证据';if(data.warnings?.length)view.article.append(el('div',data.warnings.map(w=>w.message).join('\n'),'meta'));}if(event==='error'){failed=true;terminal=true;writer.flush(text||data.message);showError('queryError',data.message+' ['+data.code+']');$('progress').textContent='本次检索失败';}});if(!terminal&&!failed)throw Error('连接提前结束，未收到完整结果，请重新提问。');}catch(error){if(error.name==='AbortError'){writer.flush(text||'已停止本次生成。');$('progress').textContent='已停止';}else{showError('queryError',error.message);writer.flush(text||'检索未完成，请检查提示后重试。');}}finally{$('progressBrief').textContent=$('progress').textContent;controller=null;busyState(false);await refreshSessions();}});
// 非题目范围禁用题库、题号、题型；保留原选择以便切回题目时继续使用。
function syncQuestionFilters(){const enabled=$('scope').value==='question';for(const name of ['question_bank_name','question_code','question_type'])$(name).disabled=!enabled;}
$('scope').addEventListener('change',syncQuestionFilters);syncQuestionFilters();
$('stop').addEventListener('click',()=>controller?.abort());$('question').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('queryForm').requestSubmit();}});$('newSession').addEventListener('click',()=>{if(busy)return;version++;sessionId=createId();openSources(false);$('sourceCount').textContent='0';$('progressBrief').textContent='教育智库';$('messages').replaceChildren(welcomeTemplate.cloneNode(true));$('sources').replaceChildren();$('progress').textContent='等待提问';$('rewrite').textContent='';showError('queryError','');$('question').focus();refreshSessions();});$('deleteSession').addEventListener('click',async()=>{if(busy)return;if(!window.confirm('确定删除当前会话及其全部聊天记录吗？删除后无法恢复。'))return;try{await api('/api/query/sessions/'+encodeURIComponent(sessionId),{method:'DELETE'});$('newSession').click();}catch(error){showError('queryError',error.message);}});$('messages').addEventListener('click',event=>{const button=event.target.closest('.example');if(button&&!busy){$('question').value=button.querySelector('strong').textContent;$('question').focus();}});const initialSession=new URLSearchParams(location.search).get('session');if(initialSession)loadSession(initialSession);else refreshSessions();
</script></body></html>
